<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 通常アイコン: 案A(スキャン枠+QR)の中央に「ひのチケ」を横帯として通す -->
  <rect width="512" height="512" rx="104" fill="#0f172a"/>
  <g stroke="#38bdf8" stroke-width="22" fill="none" stroke-linecap="round">
    <path d="M96 152 L96 116 Q96 96 116 96 L152 96"/>
    <path d="M416 152 L416 116 Q416 96 396 96 L360 96"/>
    <path d="M96 360 L96 396 Q96 416 116 416 L152 416"/>
    <path d="M416 360 L416 396 Q416 416 396 416 L360 416"/>
  </g>
  <!-- 横帯(文字行)の上: 左上/右上 finder -->
  <g fill="none" stroke="#38bdf8" stroke-width="12">
    <rect x="160" y="120" width="64" height="64" rx="14"/>
    <rect x="288" y="120" width="64" height="64" rx="14"/>
  </g>
  <g fill="#38bdf8">
    <rect x="176" y="136" width="32" height="32" rx="8"/>
    <rect x="304" y="136" width="32" height="32" rx="8"/>
  </g>
  <!-- 横帯の下: 左下 finder + データドット -->
  <rect x="160" y="320" width="64" height="64" rx="14" fill="none" stroke="#38bdf8" stroke-width="12"/>
  <g fill="#38bdf8">
    <rect x="176" y="336" width="32" height="32" rx="8"/>
    <rect x="304" y="320" width="20" height="20" rx="6"/>
    <rect x="336" y="320" width="20" height="20" rx="6"/>
    <rect x="288" y="352" width="20" height="20" rx="6"/>
    <rect x="320" y="352" width="20" height="20" rx="6"/>
    <rect x="352" y="352" width="20" height="20" rx="6"/>
  </g>
  <!-- 中央の横帯: ひのチケ(スキャン枠の左右端の間を通る一行) -->
  <text x="256" y="288" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans CJK JP',sans-serif" font-weight="700" font-size="76" fill="#38bdf8">ひのチケ</text>
</svg>
