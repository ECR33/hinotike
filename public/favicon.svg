<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- favicon: 文字なしのQRマーク(小サイズ用)。
       finder群のbboxは元 148..416(中心282)で右下寄りのため、
       translate(-26,-26) でbbox中心を viewBox 中央(256,256)に align。 -->
  <rect width="512" height="512" rx="104" fill="#0f172a"/>
  <g transform="translate(-26,-26)">
    <g fill="none" stroke="#38bdf8" stroke-width="14">
      <rect x="148" y="148" width="92" height="92" rx="18"/>
      <rect x="324" y="148" width="92" height="92" rx="18"/>
      <rect x="148" y="324" width="92" height="92" rx="18"/>
    </g>
    <g fill="#38bdf8">
      <rect x="172" y="172" width="44" height="44" rx="10"/>
      <rect x="348" y="172" width="44" height="44" rx="10"/>
      <rect x="172" y="348" width="44" height="44" rx="10"/>
      <rect x="330" y="330" width="26" height="26" rx="8"/>
      <rect x="372" y="330" width="26" height="26" rx="8"/>
      <rect x="316" y="372" width="26" height="26" rx="8"/>
      <rect x="358" y="372" width="26" height="26" rx="8"/>
      <rect x="300" y="300" width="16" height="16" rx="5"/>
    </g>
  </g>
</svg>
